font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size 12.0
disable_ligatures never
input_delay 0
sync_to_monitor no


# Colors

foreground #c9d1d9
background #0d1117

background_opacity 0.96
dynamic_background_opacity yes

cursor #e3b341
cursor_text_color #0d1117
cursor_shape block
cursor_blink_interval -1
cursor_trail 2

selection_foreground #ffffff
selection_background #264f78

mark1_foreground #0d1117
mark1_background #79c0ff

color0  #161b22
color1  #ff7b72
color2  #7ee787
color3  #d29922
color4  #79c0ff
color5  #d2a8ff
color6  #56d4dd
color7  #c9d1d9
color8  #484f58
color9  #ffa198
color10 #aff5b4
color11 #e3b341
color12 #a5d6ff
color13 #d2a8ff
color14 #76e3ea
color15 #f0f6fc


# Window

initial_window_width  100c
initial_window_height 30c

window_margin_width 0
window_padding_width 12
window_border_width 0

draw_minimal_borders no
remember_window_size yes
resize_in_steps no

linux_display_server wayland
wayland_titlebar_color system
hide_window_decorations yes
confirm_os_window_close 0


# Tabs

tab_bar_edge bottom
tab_bar_style fade
tab_fade 1 0.5 0.25 0
tab_bar_min_tabs 2

active_tab_foreground   #f0f6fc
active_tab_background   #21262d
active_tab_font_style   bold

inactive_tab_foreground #8b949e
inactive_tab_background #0d1117
