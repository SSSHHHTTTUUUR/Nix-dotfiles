# The general block and the is-locked test below come from modules/home-manager/hyprland.nix:
# with hyprlock hypridle runs the locker, with Noctalia the shell answers
# logind's Lock itself. wake-displays checks the lid before enabling outputs,
# so a closed internal panel never receives a transient DPMS on between sleep
# and restoring the lid state.
general {
    @general@
}

# `on-ac` (core's power module) exits 0 on mains, 1 on battery, so
# `on-ac || x` runs x on battery and `on-ac && x` only on mains.

# Dim first: the backlight is a laptop panel's biggest consumer. No device
# named — brightnessctl picks the only backlight class device.
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = on-ac || loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = on-ac || { @is_locked@ && hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'; }
    on-resume = wake-displays; brightnessctl -r
}

# On AC: never suspend; lock at most after 20 min idle (330/900 stay
# battery-only). Unconditional, so unplugging the charger mid-idle (past the
# battery-only 300 s lock, before this one) still ends up locked; the locker
# ignores a second lock request.
listener {
    timeout = 1200
    on-timeout = loginctl lock-session
}

# 15 min rather than 30: on battery the screen has been off for nine and a
# half of those, and s2idle is worth more than the rest.
listener {
    timeout = 900
    on-timeout = on-ac || systemctl suspend --check-inhibitors=yes
}
