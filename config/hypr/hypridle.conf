general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# `on-ac` exits 0 on mains and 1 on battery, so `on-ac || x` runs x only on
# battery and `on-ac && x` only on mains.  It comes from packages/on-ac.nix --
# before that existed these listeners called a command that was not installed,
# every one of them failed with 127, and the AC branches ran inverted: the
# machine suspended on mains and never locked there.

# Dim first.  The backlight is the single biggest consumer on this panel, so
# this is worth doing well before anything else fires.  No device is named:
# brightnessctl picks the only backlight class device, which is amdgpu_bl1
# here.  (It used to say intel_backlight, which does not exist on this AMD
# laptop, so the dim never happened at all.)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = on-ac || loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = on-ac || { pidof hyprlock && hyprctl dispatch dpms off; }
    on-resume = hyprctl dispatch dpms on; brightnessctl -r
}

# On AC: never suspend; at most lock at 20 min idle (300/330/900 stay battery-only).
listener {
    timeout = 1200
    on-timeout = on-ac && loginctl lock-session
}

# 15 min rather than 30: on battery the screen has already been off for nine
# and a half of those minutes, and s2idle on this platform is worth far more
# than the difference.
listener {
    timeout = 900
    on-timeout = on-ac || systemctl suspend
}
